; FlyBy — DIY ESP32 LED flight tracker
;
; Three build envs:
;   esp32dev — real hardware target
;   wokwi    — same firmware as esp32dev, run inside the Wokwi simulator
;              (VS Code extension reads wokwi.toml + diagram.json)
;   native   — host-side unit tests (no Arduino runtime). Compiles only
;              Arduino-free source files; pure C++ logic lives here.
;
; Common: pio run -e esp32dev | pio run -e wokwi | pio test -e native

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.14
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17

[env:wokwi]
extends = env:esp32dev
build_flags =
    -DFLYBY_WOKWI=1
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++17
    -DNATIVE_BUILD=1
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-9
; Only Arduino-free source files compile under the native toolchain.
; Add files here as new pure-C++ modules land. Anything that touches
; <Arduino.h>, the matrix library, WiFi, or HTTPClient must NOT be added.
build_src_filter = -<*> +<geo.cpp> +<adsb_parse.cpp> +<airlines.cpp> +<airports.cpp> +<layout.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
