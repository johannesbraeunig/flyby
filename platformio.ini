; FlyBy — DIY ESP32 LED flight tracker
;
; Three build envs:
;   esp32dev — real hardware target
;   wokwi    — same firmware as esp32dev, run inside the Wokwi simulator
;              (VS Code extension reads wokwi.toml + diagram.json)
;   native   — host-side unit tests (no Arduino runtime). Compiles only
;              Arduino-free source files; pure C++ logic lives here.
;
; Common: pio run -e esp32dev | pio run -e wokwi | pio test -e native

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.14
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17

[env:wokwi]
extends = env:esp32dev
build_flags =
    -DFLYBY_WOKWI=1
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASS=\"\"

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DNATIVE_BUILD=1
; Exclude all src/ from native builds — only test files (and any pure-C++
; logic explicitly added later) compile here. Arduino-dependent code stays
; out of the host toolchain.
build_src_filter = -<*>
