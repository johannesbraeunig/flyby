# fly.toml app configuration file generated for flyby-app on 2026-04-11T12:20:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flyby-app'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Never auto-stop: the OpenSky auth module caches a Bearer
  # token for ~30 min in process memory and the in-memory
  # bbox/track/route/aircraft caches warm up over the first
  # few requests. Cold-starting every time the idle timer fires
  # would burn both.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
